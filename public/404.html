<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta
      name="description"
      content="The requested Housing Navigator page could not be found."
    />
    <title>Page not found | Housing Navigator</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f7f8f4;
        color: #1f2922;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 640px);
        text-align: center;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 56px;
        color: #173f2b;
        font-weight: 800;
        text-decoration: none;
      }

      .mark {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border-radius: 12px;
        background: #173f2b;
        color: white;
        font-size: 21px;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #2c6a48;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 3.25rem);
        line-height: 1.08;
        letter-spacing: -0.035em;
      }

      .message {
        max-width: 520px;
        margin: 20px auto 32px;
        color: #536158;
        font-size: 1.05rem;
        line-height: 1.65;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }

      .button {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 24px;
        border: 1px solid #173f2b;
        border-radius: 999px;
        color: #173f2b;
        font-weight: 750;
        text-decoration: none;
      }

      .button.primary {
        background: #173f2b;
        color: white;
      }

      .button:focus-visible {
        outline: 3px solid #86b69a;
        outline-offset: 3px;
      }

      @media (max-width: 460px) {
        .brand {
          margin-bottom: 40px;
        }

        .actions {
          flex-direction: column;
        }

        .button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/" aria-label="Housing Navigator home">
        <span class="mark" aria-hidden="true">⌂</span>
        <span>Housing Navigator</span>
      </a>
      <p class="eyebrow">404 · Page not found</p>
      <h1>We couldn't find that page.</h1>
      <p class="message">
        The address may be incorrect or the page may have moved. Start with our
        verified housing resources or current waitlist information.
      </p>
      <nav class="actions" aria-label="Helpful destinations">
        <a class="button primary" href="/resources/">Find resources</a>
        <a class="button" href="/waitlist/">Track waitlists</a>
      </nav>
    </main>
  </body>
</html>
