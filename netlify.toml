# Security headers for every response.
#
# CSP notes:
#   * script-src 'self' — Vite emits only external module scripts; no inline
#     JS anywhere, so this alone neutralizes most XSS payloads.
#   * style-src includes 'unsafe-inline' (React style attributes) and
#     fonts.googleapis.com (loaded from src/index.css via @import).
#   * connect-src allows the Supabase REST/auth/functions endpoints plus
#     websockets (realtime), nothing else.
#   * frame-ancestors 'none' + X-Frame-Options DENY: the app is never framed,
#     which blocks clickjacking on the admin CMS.
# If a new external service is added (analytics, image CDN), extend the
# matching directive here or the browser will silently block it.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://us.i.posthog.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"

# Deployment marker used by the IndexNow workflow. It must never be served
# stale, otherwise a notification could race ahead of the matching deploy.
[[headers]]
  for = "/.well-known/housing-navigator-deploy.txt"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow"

# IndexNow ownership key. The value is intentionally public by protocol.
[[headers]]
  for = "/e060bb774e804994906a00517eb1de56.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    X-Robots-Tag = "noindex, nofollow"

# Keep account, dashboard, and admin surfaces out of search results. These
# headers remain visible to crawlers, unlike a robots.txt Disallow rule.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dashboard"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/login"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/signup"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/forgot-password"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/reset-password"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
