[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pin Node so builds stay reproducible on Vite 6 (needs Node 18+).
  NODE_VERSION = "20"

# React Router uses BrowserRouter, so every real application route needs a
# 200 rewrite to index.html for deep links and browser refreshes. Keep this
# allowlist in sync with src/App.tsx. Paths not listed here fall through to
# public/404.html and Netlify returns a genuine HTTP 404 instead of a soft 404.

# Public and account routes.
[[redirects]]
  from = "/resources"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/waitlist"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/mission"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/help"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/accessibility"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/signup"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/forgot-password"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/reset-password"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/index.html"
  status = 200

# Admin routes. Dynamic edit routes use one-segment placeholders so arbitrary
# nested admin paths still receive a real 404.
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/resources"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/resources/new"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/resources/:id/edit"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/waitlists"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/waitlists/new"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/waitlists/:id/edit"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/alerts"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/review"
  to = "/index.html"
  status = 200

# Security headers for every response.
#
# CSP notes:
#   * script-src 'self' — Vite emits only external module scripts; no inline
#     JS anywhere, so this alone neutralizes most XSS payloads.
#   * style-src includes 'unsafe-inline' (React style attributes) and
#     fonts.googleapis.com (loaded from src/index.css via @import).
#   * connect-src allows the Supabase REST/auth/functions endpoints plus
#     websockets (realtime), nothing else.
#   * frame-ancestors 'none' + X-Frame-Options DENY: the app is never framed,
#     which blocks clickjacking on the admin CMS.
# If a new external service is added (analytics, image CDN), extend the
# matching directive here or the browser will silently block it.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://us.i.posthog.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"

# Keep account, dashboard, and admin surfaces out of search results. These
# headers remain visible to crawlers, unlike a robots.txt Disallow rule.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dashboard"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/login"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/signup"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/forgot-password"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/reset-password"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
