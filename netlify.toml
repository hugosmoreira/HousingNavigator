[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pin Node so builds stay reproducible on Vite 6 (needs Node 18+).
  NODE_VERSION = "20"

# Public routes are generated as static HTML and shadow these fallback rules.
# Account/admin routes use the clean SPA shell in spa.html. Keep this allowlist
# in sync with src/admin/AdminApp.tsx; unknown paths fall through to the custom 404 page.

# Public and account routes.
[[redirects]]
  from = "/resources"
  to = "/spa.html"
  status = 200

[[redirects]]
  from = "/waitlist"
  to = "/spa.html"
  status = 200

[[redirects]]
  from = "/mission"
  to = "/spa.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/spa.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/spa.html"
  status = 200

[[redirects]]
