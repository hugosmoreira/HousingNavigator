name: Production uptime

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-uptime
  cancel-in-progress: true

jobs:
  check:
    name: Check housingnavigator.us
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out monitoring script
        uses: actions/checkout@v4

      - name: Check production routes and security headers
        id: uptime
        continue-on-error: true
        run: node scripts/checkProduction.mjs

      - name: Open one incident issue on failure
        if: steps.uptime.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Uptime] Housing Navigator production check failed';
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = openIssues.find(
              (issue) => !issue.pull_request && issue.title === title,
            );
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  'The scheduled production check failed.',
                  '',
                  `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  '',
                  'The monitor checks `/`, `/login`, `/resources`, the app shell, and required security headers.',
                ].join('\n'),
              });
            }

      - name: Close the incident after recovery
        if: steps.uptime.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Uptime] Housing Navigator production check failed';
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = openIssues.find(
              (issue) => !issue.pull_request && issue.title === title,
            );
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Production recovered. Passing workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

      - name: Fail the workflow when production is unhealthy
        if: steps.uptime.outcome == 'failure'
        run: exit 1
